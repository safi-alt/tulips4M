<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tulips for M</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="A tulip that grows and blooms with your hands.">
<meta property="og:title" content="Tulips for M">
<meta property="og:description" content="A tulip that grows and blooms with your hands.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Great+Vibes&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.166.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.166.0/examples/jsm/",
    "animejs": "https://cdn.jsdelivr.net/npm/animejs@3.2.2/lib/anime.es.js"
  }
}
</script>
</head>
<body>
<video id="webcamVideo" autoplay muted playsinline></video>
<canvas id="handOverlay"></canvas>
<canvas id="flowerCanvas"></canvas>
<div id="title">
  <h1>Tulips for M</h1>
  <p>left grows · right blooms</p>
</div>
<button id="handsBtn" class="ui-btn" type="button">use your hands</button>
<button id="stopCamBtn" class="ui-btn ghost" type="button">stop camera</button>
<button id="catalogTab" type="button" aria-expanded="false" aria-controls="catalog">choose a tulip</button>
<aside id="catalog" aria-label="Tulip varieties">
  <h2>Tulips</h2>
  <p class="hint">pick a variety</p>
  <div id="varietyList"></div>
</aside>
<div id="status" role="status"></div>
<div id="dedication">grown by hand, just for you</div>
<div id="hud"></div>
<script type="module" src="./js/main.js"></script>
</body>
</html>
